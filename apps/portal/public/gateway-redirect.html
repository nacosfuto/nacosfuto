<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Connecting to Payment Gateway | NACOS FUTO</title>
  <link rel="icon" type="image/svg+xml" href="/logo.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .spinner-wrap {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .spinning-logo {
      width: clamp(140px, 42vw, 220px);
      height: clamp(140px, 42vw, 220px);
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .manual-link {
      display: none;
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: #0e8040;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner-wrap">
    <img
      class="spinning-logo"
      src="https://res.cloudinary.com/a2mmcttn/image/upload/v1791451674/DICT_Synergy_Logo.png"
      alt="Loading"
    />
  </div>

  <a id="redirect-btn" class="manual-link" href="#" target="_self">Click here if not redirected automatically</a>

  <script>
    (function() {
      var redirected = false;
      var redirectBtn = document.getElementById('redirect-btn');

      function doRedirect(targetUrl) {
        if (!targetUrl || redirected) return;
        redirected = true;
        try {
          window.location.replace(targetUrl);
        } catch (_) {
          window.location.href = targetUrl;
        }
      }

      // 1. Check URL parameters for direct target
      var urlParams = new URLSearchParams(window.location.search);
      var targetParam = urlParams.get('url') || urlParams.get('target');
      if (targetParam) {
        doRedirect(decodeURIComponent(targetParam));
        return;
      }

      // 2. Check localStorage for active gateway redirect payload
      try {
        var cached = localStorage.getItem('nacos_active_gateway_redirect');
        if (cached) {
          var parsed = JSON.parse(cached);
          if (parsed && parsed.checkoutUrl && (Date.now() - (parsed.timestamp || 0) < 60000)) {
            doRedirect(parsed.checkoutUrl);
            return;
          }
        }
      } catch (_) {}

      // 3. Listen for postMessage from parent portal window
      window.addEventListener('message', function(event) {
        if (event && event.data && event.data.checkoutUrl) {
          doRedirect(event.data.checkoutUrl);
        }
      });

      // 4. Listen for storage events from parent window
      window.addEventListener('storage', function(e) {
        if (e.key === 'nacos_active_gateway_redirect' && e.newValue) {
          try {
            var val = JSON.parse(e.newValue);
            if (val && val.checkoutUrl) {
              doRedirect(val.checkoutUrl);
            }
          } catch (_) {}
        }
      });

      // 5. Fallback timer: If no redirect received after 4 seconds, show subtle manual link if stored
      setTimeout(function() {
        if (!redirected) {
          try {
            var stored = localStorage.getItem('nacos_active_gateway_redirect');
            if (stored) {
              var p = JSON.parse(stored);
              if (p && p.checkoutUrl) {
                redirectBtn.href = p.checkoutUrl;
                redirectBtn.style.display = 'block';
              }
            }
          } catch (_) {}
        }
      }, 4000);
    })();
  </script>
</body>
</html>
